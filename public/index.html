<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ホワイトボード</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#202124;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}main{width:min(960px,calc(100% - 32px));margin:auto;padding:32px 0}header,.panel-head,.board-row,.board-actions{display:flex;align-items:center}header,.panel-head{justify-content:space-between;gap:16px}header{margin-bottom:20px}h1{margin:0;font-size:28px}.subtitle{color:#5f6368;font-size:13px;margin-top:4px}button,a.button{min-height:38px;border:1px solid #c8ced8;border-radius:7px;padding:8px 14px;background:#fff;color:#202124;font:inherit;text-decoration:none;cursor:pointer}.primary{border-color:#1a73e8!important;background:#1a73e8!important;color:#fff!important}.danger{border-color:#d93025!important;color:#d93025!important}.panel{border:1px solid #d9dde5;border-radius:9px;background:#fff;overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid #e4e7ec}.panel-title{font-weight:700}.status,.board-meta{color:#5f6368;font-size:13px}.board-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-bottom:1px solid #edf0f4}.board-title{display:block;color:#202124;font-weight:700;text-decoration:none}.board-meta{display:flex;gap:8px 14px;flex-wrap:wrap;margin-top:6px}.board-actions{gap:8px}.empty{padding:28px 16px;color:#5f6368;text-align:center}@media(max-width:640px){main{width:min(100% - 20px,960px);padding:18px 0}header,.panel-head{align-items:stretch;flex-direction:column}.board-row{grid-template-columns:1fr}.board-actions{justify-content:flex-start}}
  </style>
</head>
<body><main>
  <header><div><h1>ホワイトボード</h1><div class="subtitle">自由に描いて共有する、従来のホワイトボード</div></div><button id="new-board" class="primary">新しいボードを作成</button></header>
  <section class="panel"><div class="panel-head"><div class="panel-title">ホワイトボード一覧</div><div id="status" class="status">読み込み中…</div></div><div id="board-list"></div></section>
</main><script>
const list=document.getElementById("board-list"),status=document.getElementById("status"),create=document.getElementById("new-board");
create.addEventListener("click",async()=>{create.disabled=true;try{const r=await fetch("../api/boards",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"whiteboard"})});if(!r.ok)throw Error();const b=await r.json();location.href=`./${encodeURIComponent(b.id)}`}catch{alert("ボード作成に失敗しました。");create.disabled=false}});
const date=(v)=>new Intl.DateTimeFormat("ja-JP",{dateStyle:"short",timeStyle:"short"}).format(new Date(v));
async function remove(b){if(!confirm(`「${b.title||b.id}」を削除します。元に戻せません。`))return;const r=await fetch(`../api/boards/${encodeURIComponent(b.id)}`,{method:"DELETE"});if(!r.ok)return alert("削除に失敗しました。");load()}
function render(boards){list.innerHTML="";status.textContent=`${boards.length}件`;if(!boards.length){list.innerHTML='<div class="empty">まだボードがありません。</div>';return}boards.forEach(b=>{const row=document.createElement("div");row.className="board-row";row.innerHTML=`<div><a class="board-title" href="./${encodeURIComponent(b.id)}">${b.title||b.id}</a><div class="board-meta"><span>ID: ${b.id}</span><span>作成: ${date(b.createdAt)}</span><span>線 ${b.counts.strokes} / テキスト ${b.counts.texts} / 画像 ${b.counts.images}</span></div></div>`;const actions=document.createElement("div");actions.className="board-actions";actions.innerHTML=`<a class="button" href="./${encodeURIComponent(b.id)}">開く</a>`;const del=document.createElement("button");del.className="danger";del.textContent="削除";del.onclick=()=>remove(b);actions.append(del);row.append(actions);list.append(row)})}
async function load(){try{const r=await fetch("../api/boards?mode=whiteboard");if(!r.ok)throw Error();render(await r.json())}catch{status.textContent="読み込み失敗"}}load();
</script></body></html>
